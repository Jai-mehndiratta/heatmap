services:
  - type: web
    name: marketlens-dashboard
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: SYNC_CONCURRENCY
        value: "6"
      - key: YAHOO_CONCURRENCY
        value: "6"
    # Persistent disks are available on paid Render plans. To keep snapshots
    # across deploys/restarts, uncomment the disk below, point DATA_DIR at
    # /var/data, and redeploy.
    # disk:
    #   name: marketlens-data
    #   mountPath: /var/data
    #   sizeGB: 1
